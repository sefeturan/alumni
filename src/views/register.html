<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kayıt Ol | Alumni Network</title><link rel="stylesheet" href="/styles/alumni.css"><style>.auth-wrap{max-width:620px;margin:4rem auto;padding:0 1rem}.auth-card{background:#fff;border:1px solid #e5eaf2;border-radius:20px;padding:2rem;box-shadow:0 14px 38px rgba(23,43,77,.08)}.auth-card h1{color:#172b4d;margin-bottom:.5rem}.auth-card p{color:#64748b;margin-bottom:1.5rem}.auth-card label{display:block;font-weight:600;margin:.9rem 0 .35rem}.auth-card input,.auth-card select{width:100%;padding:.8rem;border:1px solid #d9e1ee;border-radius:10px}.auth-card button{margin-top:1.25rem;width:100%}.auth-foot{text-align:center;margin-top:1rem}</style></head><body><main class="auth-wrap"><section class="auth-card"><h1>Alumni Network'e katıl</h1><p>Mezun veya öğrenci hesabını oluştur.</p><form method="POST" action="/auth/register"><label for="name">Ad Soyad</label><input id="name" name="name" autocomplete="name" minlength="2" required><label for="email">E-posta</label><input id="email" name="email" type="email" autocomplete="email" required><label for="password">Şifre (en az 10 karakter)</label><input id="password" name="password" type="password" minlength="10" autocomplete="new-password" required><label for="role">Hesap türü</label><select id="role" name="role"><option value="alumni">Mezun</option><option value="student">Öğrenci</option></select><label for="department">Bölüm (isteğe bağlı)</label><input id="department" name="department"><label for="graduationYear">Mezuniyet yılı (isteğe bağlı)</label><input id="graduationYear" name="graduationYear" type="number" min="1900" max="2100"><button type="submit">Hesap oluştur</button></form><div class="auth-foot">Zaten hesabın var mı? <a href="/login">Giriş yap</a></div></section></main><script src="/assets/auth-nav.js" defer></script></body></html>
