<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hesabım | Alumni Network</title><link rel="stylesheet" href="/styles/alumni.css"><style>.workspace{max-width:960px;margin:3rem auto;padding:0 1rem}.workspace-card{background:#fff;border:1px solid #e5eaf2;border-radius:20px;padding:2rem;box-shadow:0 14px 38px rgba(23,43,77,.08)}.workspace h1{color:#172b4d}.role{display:inline-block;background:#e8edff;color:#3157d5;border-radius:999px;padding:.3rem .8rem;font-weight:700}.workspace-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin:1.5rem 0}.workspace-grid div{background:#f4f7fb;border-radius:12px;padding:1rem}.workspace-grid small{display:block;color:#64748b}.workspace-grid strong{color:#172b4d}</style></head><body><main class="workspace"><section class="workspace-card"><span class="role">{{USER_ROLE}}</span><h1>Merhaba, {{USER_NAME}}</h1><p>{{ROLE_MESSAGE}}</p><div class="workspace-grid"><div><small>E-posta</small><strong>{{USER_EMAIL}}</strong></div><div><small>Bölüm</small><strong>{{USER_DEPARTMENT}}</strong></div><div><small>Mezuniyet yılı</small><strong>{{USER_YEAR}}</strong></div></div><h2>Hesap alanın</h2><p>Profilini güncel tutabilir, topluluk duyurularını ve kariyer fırsatlarını takip edebilirsin.</p><p><a href="/announcements">Duyuruları görüntüle</a> · <a href="/api/jobs">Kariyer API</a></p></section></main><script src="/assets/auth-nav.js" defer></script></body></html>
