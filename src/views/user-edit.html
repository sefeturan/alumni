<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{USER_NAME}} - Profili Düzenle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-light: #dbeafe;
      --dark: #0f172a;
      --card-bg: #ffffff;
      --body-bg: #f8fafc;
      --text: #334155;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--body-bg); color: var(--text); line-height: 1.6; }

    header {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .nav-container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--dark);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .logo span { color: var(--primary); }

    .nav-links { display: flex; gap: 1.5rem; list-style: none; align-items: center; }
    .nav-links a { text-decoration: none; color: var(--text-muted); font-weight: 600; font-size: 0.95rem; }
    .nav-links a:hover { color: var(--primary); }

    main {
      max-width: 680px;
      margin: 3rem auto;
      padding: 0 1.5rem;
    }

    .edit-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 2.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .edit-header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.5rem;
      margin-bottom: 1.75rem;
    }

    .edit-header h1 {
      font-size: 1.6rem;
      color: var(--dark);
      margin-bottom: 0.25rem;
    }

    .edit-header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--dark);
      margin-bottom: 0.4rem;
    }

    input, select, textarea {
      width: 100%;
      padding: 0.75rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .actions-bar {
      display: flex;
      justify-content: flex-end;
      gap: 1rem;
      border-top: 1px solid var(--border);
      padding-top: 1.75rem;
      margin-top: 1.75rem;
    }

    .btn {
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      text-decoration: none;
      border: none;
      transition: all 0.2s;
    }

    .btn-cancel {
      background: #e2e8f0;
      color: var(--dark);
    }
    .btn-cancel:hover { background: #cbd5e1; }

    .btn-save {
      background: var(--primary);
      color: white;
    }
    .btn-save:hover { background: var(--primary-dark); }
  </style>
</head>
<body>
  <header>
    <div class="nav-container">
      <a href="/" class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
          <path d="M6 12v5c3 3 9 3 12 0v-5"/>
        </svg>
        Alumni<span>Network</span>
      </a>
      <ul class="nav-links">
        <li><a href="/">Ana Sayfa</a></li>
        <li><a href="/users">Kullanıcılar</a></li>
        <li><a href="/about">Hakkımızda</a></li>
      </ul>
    </div>
  </header>

  <main>
    <div class="edit-card">
      <div class="edit-header">
        <h1>✏️ Profili Düzenle</h1>
        <p><strong>{{USER_NAME}}</strong> adlı kullanıcının bilgilerini güncelleyin.</p>
      </div>

      <!-- Update form posts to /users/:id/update -->
      <form action="/users/{{USER_ID}}/update" method="POST">
        <div class="form-group">
          <label for="name">Ad Soyad *</label>
          <input type="text" id="name" name="name" value="{{USER_NAME}}" required>
        </div>

        <div class="form-group">
          <label for="email">E-posta Adresi *</label>
          <input type="email" id="email" name="email" value="{{USER_EMAIL}}" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="role">Rol</label>
            <select id="role" name="role">
              {{ROLE_OPTIONS}}
            </select>
          </div>

          <div class="form-group">
            <label for="graduationYear">Mezuniyet Yılı</label>
            <input type="number" id="graduationYear" name="graduationYear" value="{{USER_GRADUATION_YEAR}}" min="1950" max="2035">
          </div>
        </div>

        <div class="form-group">
          <label for="department">Bölüm</label>
          <input type="text" id="department" name="department" value="{{USER_DEPARTMENT}}">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="company">Şirket / Kurum</label>
            <input type="text" id="company" name="company" value="{{USER_COMPANY}}">
          </div>

          <div class="form-group">
            <label for="title">Unvan / Pozisyon</label>
            <input type="text" id="title" name="title" value="{{USER_TITLE}}">
          </div>
        </div>

        <div class="form-group">
          <label for="skills">Yetenekler (Virgülle ayırın)</label>
          <input type="text" id="skills" name="skills" value="{{USER_SKILLS}}">
        </div>

        <div class="form-group">
          <label for="bio">Biyografi</label>
          <textarea id="bio" name="bio" rows="3">{{USER_BIO}}</textarea>
        </div>

        <div class="actions-bar">
          <a href="/users/{{USER_ID}}" class="btn btn-cancel">İptal</a>
          <button type="submit" class="btn btn-save">Değişiklikleri Kaydet (POST /users/{{USER_ID}}/update)</button>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
