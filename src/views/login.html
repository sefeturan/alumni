<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Giriş Yap | Alumni Network</title><link rel="stylesheet" href="/styles/alumni.css"><style>.auth-wrap{max-width:520px;margin:5rem auto;padding:0 1rem}.auth-card{background:#fff;border:1px solid #e5eaf2;border-radius:20px;padding:2rem;box-shadow:0 14px 38px rgba(23,43,77,.08)}.auth-card h1{color:#172b4d;margin-bottom:.5rem}.auth-card p{color:#64748b;margin-bottom:1.5rem}.auth-card label{display:block;font-weight:600;margin:.9rem 0 .35rem}.auth-card input{width:100%;padding:.8rem;border:1px solid #d9e1ee;border-radius:10px}.auth-card button{margin-top:1.25rem;width:100%}.auth-foot{text-align:center;margin-top:1rem}</style></head><body><main class="auth-wrap"><section class="auth-card"><h1>Tekrar hoş geldin</h1><p>Hesabına giriş yaparak devam et.</p><form method="POST" action="/auth/login"><label for="email">E-posta</label><input id="email" name="email" type="email" autocomplete="email" required><label for="password">Şifre</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">Giriş yap</button></form><div class="auth-foot">Hesabın yok mu? <a href="/register">Kayıt ol</a></div></section></main><script src="/assets/auth-nav.js" defer></script></body></html>
